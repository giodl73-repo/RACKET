# Local tracker repo map for generated Cargo dependency overrides.
# Cargo does not read this file directly; run:
#
#   python tools\repo_map.py write-cargo-config
#

[standard]
version = 1
cargo_config = ".cargo/config.toml"

[repos.this_repo]
role = "current repository"
relative = "."
clone_url = "https://github.com/giodl73-repo/RACKET.git"

[repos.court]
role = "tracker dependency for racket"
relative = "..\\court"
clone_url = "https://github.com/giodl73-repo/COURT.git"
cargo_patches = [
  { package = "court-core", source = "https://github.com/giodl73-repo/COURT.git", path = "crates/court-core" },
]
