[package]
name = "racket-workbench"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "racket-workbench-cli"
path = "src/main.rs"

[dependencies]
racket-core = { path = "../../crates/racket-core" }
court-inspector = { git = "https://github.com/giodl73-repo/COURT.git", branch = "main" }
serde_json = "1"
wasm-bindgen = "=0.2.127"
